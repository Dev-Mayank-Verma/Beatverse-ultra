name: Build BeatVerse APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (try 3.35.7, if it fails try 3.32.8)"
        default: "3.35.7"
        required: true

env:
  UPSTREAM_REPO: https://github.com/HemantKArya/BloomeeTunes.git
  APP_NAME: BeatVerse
  APP_ID: com.beatverse.app

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone upstream
        run: |
          git clone --depth 1 "$UPSTREAM_REPO" app
          ls app

      - name: Rebrand to BeatVerse
        working-directory: app
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i -E "s/applicationId\s*=?\s*[\"'][^\"']+[\"']/applicationId = \"${APP_ID}\"/" "$f"
            case "$f" in *.gradle) sed -i "s/applicationId = \"/applicationId \"/" "$f";; esac
          done

          sed -i -E "s/android:label=\"[^\"]*\"/android:label=\"${APP_NAME}\"/" android/app/src/main/AndroidManifest.xml

          grep -rIl '<string name="app_name">' android/app/src --include=strings.xml \
            | xargs -r sed -i -E "s#(<string name=\"app_name\">)[^<]*(</string>)#\1${APP_NAME}\2#"

          printf '\n\n---\n%s is a modified version of Bloomee Tunes by HemantKArya, under the original open-source license (see LICENSE). Source: %s\n' \
            "${APP_NAME}" "${UPSTREAM_REPO%.git}" >> README.md

          grep -rn "applicationId" android/app/build.gradle* || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: |
          flutter --version
          flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatVerse-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload rebranded source
        uses: actions/upload-artifact@v4
        with:
          name: BeatVerse-source
          path: |
            app
            !app/.git
            !app/build
