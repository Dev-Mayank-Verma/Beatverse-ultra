
name: Build BeatVerse APK

# Upload BeatVerse-source.zip to the repo root -> this runs automatically.
# You can also run it manually: Actions tab -> Build BeatVerse APK -> Run workflow.
on:
  push:
    paths:
      - "BeatVerse-source.zip"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (try 3.35.7, if it fails try 3.32.8)"
        default: "3.35.7"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          unzip -q BeatVerse-source.zip -d src
          PUB=$(find src -maxdepth 3 -name pubspec.yaml | head -1)
          test -n "$PUB" || { echo "pubspec.yaml not found in zip"; exit 1; }
          echo "APP_DIR=$(dirname "$PUB")" >> "$GITHUB_ENV"
          echo "Project root: $(dirname "$PUB")"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.35.7' }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter --version
          flutter pub get

      - name: Build release APK (arm64)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatVerse-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
