name: Build BeatVerse APK

# Upload BeatVerse-source.zip to the repo root -> this runs automatically.
# You can also run it manually: Actions tab -> Build BeatVerse APK -> Run workflow.
on:
  push:
    paths:
      - "BeatVerse-source.zip"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (try 3.35.7, if it fails try 3.32.8)"
        default: "3.35.7"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          unzip -q BeatVerse-source.zip -d src
          # the real app root is the folder that has lib/main.dart AND pubspec.yaml
          MAIN=$(find src -maxdepth 4 -path "*/lib/main.dart" | head -1)
          test -n "$MAIN" || { echo "lib/main.dart not found in zip"; exit 1; }
          ROOT=$(dirname "$(dirname "$MAIN")")
          test -f "$ROOT/pubspec.yaml" || { echo "pubspec.yaml missing in $ROOT"; exit 1; }
          echo "APP_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.35.7' }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter --version
          flutter pub get

      - name: Build release APK (arm64)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatVerse-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to Releases (direct download, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk" BeatVerse.apk
          gh release create "build-${{ github.run_number }}" BeatVerse.apk \
            --repo "${{ github.repository }}" \
            --title "BeatVerse build ${{ github.run_number }}" \
            --notes "Install BeatVerse.apk on your phone."
