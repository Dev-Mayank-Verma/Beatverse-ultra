name: Build BeatVerse APK

on:
  push:
    paths:
      - "BeatVerse-source.zip"
  workflow_dispatch:
    inputs:
      flutter_version:
        description: "Flutter version (try 3.35.7)"
        default: "3.35.7"
        required: true
      entrypoint:
        description: "Optional: relative path to entrypoint Dart file inside chosen project (e.g. lib/main_dev.dart)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Extract source zip and choose app directory
        shell: bash
        run: |
          set -euo pipefail

          rm -rf src
          unzip -q BeatVerse-source.zip -d src

          echo "=== Repo preview ==="
          find src -maxdepth 4 -type d -print | sed -n '1,200p' || true

          mapfile -t PUBS < <(find src -type f -name pubspec.yaml 2>/dev/null || true)

          if [ ${#PUBS[@]} -eq 0 ]; then
            echo "pubspec.yaml not found in zip"
            exit 1
          fi

          echo "Found pubspecs:"
          for p in "${PUBS[@]}"; do echo " - $p"; done

          ENTRYPOINT="${{ github.event.inputs.entrypoint || '' }}"
          CANDIDATES=()

          for PUB in "${PUBS[@]}"; do
            DIR="$(dirname "$PUB")"

            if [ -n "$ENTRYPOINT" ] && [ -f "$DIR/$ENTRYPOINT" ]; then
              CANDIDATES+=("$DIR")
              continue
            fi

            if [ -f "$DIR/lib/main.dart" ] || [ -d "$DIR/android" ] || [ -d "$DIR/ios" ]; then
              CANDIDATES+=("$DIR")
            fi
          done

          if [ ${#CANDIDATES[@]} -eq 0 ]; then
            echo "No valid Flutter app directory found in zip."
            echo "Available pubspecs:"
            for p in "${PUBS[@]}"; do echo " - $p"; done
            exit 1
          fi

          CHOSEN=""
          if [ -n "$ENTRYPOINT" ]; then
            for DIR in "${CANDIDATES[@]}"; do
              if [ -f "$DIR/$ENTRYPOINT" ]; then
                CHOSEN="$DIR"
                break
              fi
            done
          fi

          if [ -z "$CHOSEN" ]; then
            CHOSEN="${CANDIDATES[0]}"
          fi

          if [ ! -d "$CHOSEN" ]; then
            echo "Selected app directory does not exist: $CHOSEN"
            exit 1
          fi

          echo "APP_DIR=$CHOSEN" >> "$GITHUB_ENV"
          echo "ENTRYPOINT=$ENTRYPOINT" >> "$GITHUB_ENV"
          echo "Project root chosen: $CHOSEN"

          ls -la "$CHOSEN"
          if command -v tree >/dev/null 2>&1; then
            tree -a "$CHOSEN" | sed -n '1,200p'
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version || '3.35.7' }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          flutter --version
          flutter pub get

      - name: Pre-build checks
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -euo pipefail

          if [ ! -d "${{ env.APP_DIR }}" ]; then
            echo "APP_DIR is invalid: ${{ env.APP_DIR }}"
            exit 1
          fi

          if [ -n "${{ env.ENTRYPOINT }}" ]; then
            if [ ! -f "${{ env.APP_DIR }}/${{ env.ENTRYPOINT }}" ]; then
              echo "ERROR: Requested entrypoint '${{ env.ENTRYPOINT }}' not found in ${{ env.APP_DIR }}"
              ls -la "${{ env.APP_DIR }}"
              exit 1
            fi
            echo "Using custom entrypoint: ${{ env.ENTRYPOINT }}"
            TARGET="--target ${{ env.ENTRYPOINT }}"
          else
            if [ ! -f "${{ env.APP_DIR }}/lib/main.dart" ]; then
              echo "ERROR: lib/main.dart not found in ${{ env.APP_DIR }}; cannot build app."
              ls -la "${{ env.APP_DIR }}"
              exit 1
            fi
            TARGET=""
            echo "Using default entrypoint lib/main.dart"
          fi

          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: Build release APK (arm64)
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release ${{ env.TARGET }} --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatVerse-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
